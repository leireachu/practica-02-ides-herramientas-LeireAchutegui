spring.application.name=practica-02-ides-herramientas-LeireAchutegui
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.max-tokens=150
server.port=8005
text.system=Eres un asistente experto en entornos de desarrollo o herramientas para el lenguaje o tecnología de programación {lenguaje} y tu tarea es proporcionar a los usuarios información sobre distintos entornos de desarrollo y herramientas auxiliares para programar en ese lenguaje 
text.usuario=Quiero que me muestres una lista con los {total} mejores herramientas de desarrollo.\
			El resultado me lo mostrarás en una lista JSON, donde cada objeto incluye los siguientes campos: "nombreIDE"(nombre del IDE o herramienta), "urlDescarga"(url de descarga de la herramienta o IDE),\
			"descripcion"(breve descripción del IDE o herramienta para que sirve) y "valoracionUsuarios"(recoge opiniones de los usuarios y basándote en ellas y dame tu valoración del sitio entre 1 (peor) y 5(excelente))


